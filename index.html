<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Learning App - 영어 학습기</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-brand">English Learning App</div>
            <div class="nav-links">
                <button class="nav-btn active" data-section="vocabulary">단어 학습</button>
                <button class="nav-btn" data-section="quiz">퀴즈</button>
                <button class="nav-btn" data-section="sentences">문장 학습</button>
                <button class="nav-btn" data-section="stats">학습 통계</button>
            </div>
        </nav>

        <!-- Vocabulary Section (Flashcards) -->
        <section id="vocabulary" class="section active">
            <div class="section-header">
                <h2>단어 학습</h2>
                <div class="level-selector">
                    <button class="level-btn active" data-level="beginner">초급</button>
                    <button class="level-btn" data-level="intermediate">중급</button>
                    <button class="level-btn" data-level="advanced">고급</button>
                </div>
            </div>
            <div class="flashcard-container">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <span class="card-label">영어</span>
                            <span class="card-word" id="card-word"></span>
                            <span class="card-phonetic" id="card-phonetic"></span>
                            <span class="card-hint">클릭하여 뜻 확인</span>
                        </div>
                        <div class="flashcard-back">
                            <span class="card-label">한국어</span>
                            <span class="card-meaning" id="card-meaning"></span>
                            <span class="card-example" id="card-example"></span>
                        </div>
                    </div>
                </div>
                <div class="card-controls">
                    <button class="btn btn-secondary" id="btn-prev">이전</button>
                    <span class="card-counter" id="card-counter">1 / 10</span>
                    <button class="btn btn-primary" id="btn-next">다음</button>
                </div>
                <div class="card-actions">
                    <button class="btn btn-danger" id="btn-unknown">모르겠어요</button>
                    <button class="btn btn-success" id="btn-known">알고 있어요</button>
                </div>
            </div>
        </section>

        <!-- Quiz Section -->
        <section id="quiz" class="section">
            <div class="section-header">
                <h2>퀴즈</h2>
                <div class="quiz-info">
                    <span id="quiz-score">점수: 0</span>
                    <span id="quiz-progress">1 / 10</span>
                </div>
            </div>
            <div class="quiz-container">
                <div class="quiz-question" id="quiz-question">
                    <span class="quiz-word" id="quiz-word"></span>
                    <span class="quiz-prompt">의 뜻은?</span>
                </div>
                <div class="quiz-options" id="quiz-options"></div>
                <div class="quiz-feedback" id="quiz-feedback"></div>
                <button class="btn btn-primary quiz-next-btn" id="quiz-next-btn" style="display:none;">다음 문제</button>
            </div>
            <div class="quiz-result" id="quiz-result" style="display:none;">
                <h3>퀴즈 결과</h3>
                <div class="result-score" id="result-score"></div>
                <div class="result-detail" id="result-detail"></div>
                <button class="btn btn-primary" id="quiz-restart">다시 풀기</button>
            </div>
        </section>

        <!-- Sentences Section -->
        <section id="sentences" class="section">
            <div class="section-header">
                <h2>문장 학습</h2>
                <div class="level-selector">
                    <button class="level-btn sentence-level active" data-level="beginner">초급</button>
                    <button class="level-btn sentence-level" data-level="intermediate">중급</button>
                    <button class="level-btn sentence-level" data-level="advanced">고급</button>
                </div>
            </div>
            <div class="sentence-container">
                <div class="sentence-card" id="sentence-card">
                    <div class="sentence-korean" id="sentence-korean"></div>
                    <div class="sentence-english" id="sentence-english"></div>
                    <div class="sentence-input-area">
                        <input type="text" class="sentence-input" id="sentence-input" placeholder="빈칸에 들어갈 단어를 입력하세요" autocomplete="off">
                        <button class="btn btn-primary" id="sentence-check">확인</button>
                    </div>
                    <div class="sentence-feedback" id="sentence-feedback"></div>
                    <div class="sentence-hint-area">
                        <button class="btn btn-secondary" id="sentence-hint">힌트 보기</button>
                        <span class="hint-text" id="hint-text"></span>
                    </div>
                </div>
                <div class="card-controls">
                    <button class="btn btn-secondary" id="sentence-prev">이전</button>
                    <span class="card-counter" id="sentence-counter">1 / 10</span>
                    <button class="btn btn-primary" id="sentence-next">다음</button>
                </div>
            </div>
        </section>

        <!-- Stats Section -->
        <section id="stats" class="section">
            <div class="section-header">
                <h2>학습 통계</h2>
                <button class="btn btn-secondary" id="reset-stats">통계 초기화</button>
            </div>
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon">📚</div>
                    <div class="stat-value" id="stat-total-words">0</div>
                    <div class="stat-label">학습한 단어</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-value" id="stat-known-words">0</div>
                    <div class="stat-label">아는 단어</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-value" id="stat-quiz-accuracy">0%</div>
                    <div class="stat-label">퀴즈 정답률</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="stat-streak">0일</div>
                    <div class="stat-label">연속 학습</div>
                </div>
            </div>
            <div class="stats-detail">
                <h3>레벨별 진행 상황</h3>
                <div class="progress-group">
                    <div class="progress-item">
                        <span class="progress-label">초급</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-beginner"></div>
                        </div>
                        <span class="progress-percent" id="percent-beginner">0%</span>
                    </div>
                    <div class="progress-item">
                        <span class="progress-label">중급</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-intermediate"></div>
                        </div>
                        <span class="progress-percent" id="percent-intermediate">0%</span>
                    </div>
                    <div class="progress-item">
                        <span class="progress-label">고급</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-advanced"></div>
                        </div>
                        <span class="progress-percent" id="percent-advanced">0%</span>
                    </div>
                </div>
                <h3>최근 학습 기록</h3>
                <div class="history-list" id="history-list"></div>
            </div>
        </section>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
